[preferred]
default=hyprland;gtk

# Secret (keyring) has no hyprland or gtk backend — xdg-desktop-portal-gtk
# implements no Secret interface at all, and kwallet.portal ships
# UseIn=kde, so under XDG_CURRENT_DESKTOP=Hyprland nothing answers.
# Chromium then falls back to its `basic` store (a hardcoded key) and
# silently drops every cookie/password it encrypted through KWallet under
# the KDE session. Naming the backend explicitly overrides UseIn, so both
# sessions reach the same wallet and the same key.
org.freedesktop.impl.portal.Secret=kwallet

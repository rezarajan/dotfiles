# Chromium / Chrome launch flags. Read by the Arch chromium launcher
# (/usr/bin/chromium) from ~/.config/chromium-flags.conf; blank lines and
# # comments are stripped.

--enable-features=WaylandWindowDecorations,AcceleratedVideoEncode,AcceleratedVideoDecodeLinuxZeroCopyGL
--ozone-platform-hint=auto

# Credential storage. Chromium picks its cookie/password encryption key
# from the desktop it detects: KDE -> KWallet, unknown -> `basic`, a
# hardcoded key. Under XDG_CURRENT_DESKTOP=Hyprland it lands on `basic`,
# cannot decrypt anything written through KWallet in the KDE session, and
# drops it — every login gone. Pinning the store makes both sessions use
# the same wallet, so profiles survive switching desktops.
# (The companion half is xdg-desktop-portal/hyprland-portals.conf, which
# points the Secret portal at the same kwallet backend.)
--password-store=kwallet6

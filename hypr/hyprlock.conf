# Lock screen — Gruvbox Dragon. Colors come from theme/hyprlock-colors.conf,
# the active copy of the generated hyprlock-{dark,light}.conf tokens
# (managed by scripts/theme-mode.sh; launch via scripts/lock.sh).

source = ~/.config/hypr/theme/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    color = $bg
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}

# time, big and quiet
label {
    monitor =
    text = cmd[update:30000] date +'%H:%M'
    color = $fg_bright
    font_size = 88
    font_family = Inter Medium
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d'
    color = $fg
    font_size = 17
    font_family = Inter
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    position = 0, -40
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.25

    inner_color = $bg_scrim
    outer_color = $border_inactive
    check_color = $accent
    fail_color = $negative
    font_color = $fg_bright
    font_family = Inter
    placeholder_text = <i>password</i>
    fail_text = <i>wrong — $ATTEMPTS tries</i>
}

label {
    monitor =
    text = $USER
    color = $fg_muted
    font_size = 13
    font_family = Inter
    position = 0, -100
    halign = center
    valign = center
}
